
services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_HOST: ":8080"
      DATABASE_DSN: "postgres://authuser:authpass@postgres:5432/authdb?sslmode=disable"
      JWT_ACCESS_SECRET: "dev-access-secret-32-chars-long!"
      JWT_REFRESH_SECRET: "dev-refresh-secret-32-chars-long"
      LOG_LEVEL: "debug"
      LOG_FORMAT: "json"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: authpass
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
